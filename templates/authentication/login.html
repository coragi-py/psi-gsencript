{% extends 'base.html' %} {% block content %}
<div class="auth-container">
  <div id="login-flow">
    <h2>IDENTIFICAÇÃO</h2>
    <form id="form-login">
      <!-- ETAPA 1: CREDENCIAIS -->
      <div id="step-1">
        <div class="form-group">
          <label>E-MAIL</label>
          <input
            type="email"
            id="email"
            name="username"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label>SENHA</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="senha"
              name="password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePass('senha')"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button
          type="button"
          onclick="showMFAStep()"
          class="btn-primary btn-full"
        >
          PRÓXIMO
        </button>
      </div>

      <!-- ETAPA 2: MFA -->
      <div id="step-2" style="display: none">
        <div class="form-group">
          <label>CÓDIGO MFA (6 DÍGITOS)</label>
          <input
            type="text"
            id="token_2fa"
            maxlength="6"
            placeholder="000000"
            style="text-align: center; letter-spacing: 8px; font-size: 1.8rem"
          />
        </div>
        <button type="submit" class="btn-primary btn-full">
          DESBLOQUEAR COFRE
        </button>
        <button
          type="button"
          onclick="resetLogin()"
          style="
            background: none;
            border: none;
            color: var(--text-dim);
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            width: 100%;
          "
        >
          ← Voltar para e-mail
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  // Variáveis de estado para bater com seu authentication/views.py
  let tempCredentials = {
    username: "",
    password: "",
  };

  function togglePass(id) {
    const input = document.getElementById(id);
    const icon = input.nextElementSibling.querySelector("i");
    input.type = input.type === "password" ? "text" : "password";
    icon.classList.toggle("fa-eye");
    icon.classList.toggle("fa-eye-slash");
  }

  // Transição visual (Front-end apenas)
  function showMFAStep() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!email || !senha) {
      alert("Por favor, preencha as credenciais.");
      return;
    }

    document.getElementById("step-1").style.display = "none";
    document.getElementById("step-2").style.display = "block";
    document.getElementById("token_2fa").focus();
  }

  function resetLogin() {
    document.getElementById("step-2").style.display = "none";
    document.getElementById("step-1").style.display = "block";
  }

  // O ENVIO REAL: Envia tudo para o seu login_usuario no Python
  document
    .getElementById("form-login")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("email").value;
      const password = document.getElementById("senha").value;
      const token = document.getElementById("token_2fa").value;

      const dadosParaEnviar = {
        username: username,
        password: password,
        token_2fa: token,
      };

      try {
        const response = await fetch('{% url "login" %}', {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}",
          },
          body: JSON.stringify(dadosParaEnviar),
        });

        const result = await response.json();

        if (response.status === 200) {
          // Login com sucesso (Item 1.9 do seu comentário no código)
          window.location.href = "/vault/";
        } else {
          alert("Erro no Login: " + (result.erro || "Falha na autenticação"));
          // Se errar, volta para o passo 1 para segurança
          resetLogin();
        }
      } catch (err) {
        alert("Erro de comunicação com o servidor.");
      }
    });
</script>
{% endblock %}
