{% extends 'base.html' %} {% block content %}
<div class="auth-container">
  <div id="login-flow">
    <h2>IDENTIFICAÇÃO</h2>
    <form id="form-login" onsubmit="return false;">
      <div id="step-1">
        <div class="form-group">
          <label>E-MAIL</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>SENHA</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="senha"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePass('senha')"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <a
            href="{% url 'solicitar_recuperacao' %}"
            style="
              font-size: 0.7rem;
              color: var(--text-dim);
              text-decoration: none;
              display: block;
              margin-top: 5px;
            "
          >
            Esqueceu a senha?
          </a>
        </div>
        <button
          type="button"
          id="btn-next"
          onclick="handleStep1()"
          class="btn-primary btn-full"
        >
          PRÓXIMO
        </button>
      </div>

      <div id="step-2" style="display: none">
        <div class="form-group">
          <label>CÓDIGO MFA (6 DÍGITOS)</label>
          <input
            type="text"
            id="token_2fa"
            maxlength="6"
            placeholder="000000"
            style="text-align: center; letter-spacing: 8px; font-size: 1.8rem"
          />
        </div>
        <button
          type="button"
          id="btn-login"
          onclick="handleStep2()"
          class="btn-primary btn-full"
        >
          DESBLOQUEAR COFRE
        </button>
        <button
          type="button"
          onclick="resetLogin()"
          style="
            background: none;
            border: none;
            color: var(--text-dim);
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            width: 100%;
          "
        >
          ← Voltar para e-mail
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  function togglePass(id) {
    const input = document.getElementById(id);
    const icon = input.nextElementSibling.querySelector("i");
    input.type = input.type === "password" ? "text" : "password";
    icon.classList.toggle("fa-eye");
    icon.classList.toggle("fa-eye-slash");
  }

  // Captura o "Enter" nos campos para disparar a função correta da etapa
  document.getElementById("senha").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleStep1();
  });
  document.getElementById("token_2fa").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleStep2();
  });

  // ETAPA 1: Validar apenas Usuário e Senha
  async function handleStep1() {
    const username = document.getElementById("email").value;
    const password = document.getElementById("senha").value;

    if (!username || !password) {
      alert("Preencha todos os campos.");
      return;
    }

    const btn = document.getElementById("btn-next");
    btn.innerText = "VALIDANDO...";
    btn.disabled = true;

    try {
      const response = await fetch('{% url "validar_credenciais" %}', {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({ username, password }),
      });

      if (response.ok) {
        document.getElementById("step-1").style.display = "none";
        document.getElementById("step-2").style.display = "block";
        document.getElementById("token_2fa").focus();
      } else {
        const result = await response.json();
        alert("Erro: " + (result.erro || "Credenciais inválidas."));
      }
    } catch (err) {
      alert("Erro de conexão com o servidor.");
    } finally {
      btn.innerText = "PRÓXIMO";
      btn.disabled = false;
    }
  }

  // ETAPA 2: Finalizar o Login com o Token
  async function handleStep2() {
    const username = document.getElementById("email").value;
    const password = document.getElementById("senha").value;
    const token = document.getElementById("token_2fa").value;

    if (!token) {
      alert("Digite o código MFA.");
      return;
    }

    const btn = document.getElementById("btn-login");
    btn.innerText = "AUTENTICANDO...";
    btn.disabled = true;

    try {
      const response = await fetch('{% url "login" %}', {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({ username, password, token_2fa: token }),
      });

      const result = await response.json();

      if (response.status === 200) {
        window.location.href = "/vault/";
      } else {
        alert("Erro: " + (result.erro || "Código inválido."));
        document.getElementById("token_2fa").value = "";
      }
    } catch (err) {
      alert("Erro de autenticação.");
    } finally {
      btn.innerText = "DESBLOQUEAR COFRE";
      btn.disabled = false;
    }
  }

  function resetLogin() {
    document.getElementById("step-2").style.display = "none";
    document.getElementById("step-1").style.display = "block";
    document.getElementById("token_2fa").value = "";
  }
</script>
{% endblock %}
