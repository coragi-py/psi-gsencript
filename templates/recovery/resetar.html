{% extends 'base.html' %} {% block content %}
<div class="vault-container">
  <div class="card shadow-lg">
    <h2 class="text-accent mb-4">REDEFINIR SENHA</h2>
    <p class="mb-4 text-muted small">
      Crie uma nova senha robusta para reestabelecer o acesso seguro ao seu
      cofre.
    </p>

    <form id="form-resetar">
      <input type="hidden" id="token" value="{{ token }}" />

      <div class="form-group mb-3">
        <label for="senha">Nova Senha</label>
        <div
          class="input-group"
          style="position: relative; display: flex; align-items: center"
        >
          <input
            type="password"
            id="senha"
            class="form-control"
            required
            placeholder="••••••••"
            style="padding-right: 60px"
          />
          <button
            type="button"
            id="toggle-senha"
            style="
              position: absolute;
              right: 15px;
              background: none;
              border: none;
              color: var(--accent);
              font-family: monospace;
              font-size: 0.85rem;
              cursor: pointer;
              z-index: 10;
              padding: 0;
            "
          >
            Ver
          </button>
        </div>
      </div>

      <div class="form-group mb-4">
        <label for="confirmar_senha">Confirmar Nova Senha</label>
        <div
          class="input-group"
          style="position: relative; display: flex; align-items: center"
        >
          <input
            type="password"
            id="confirmar_senha"
            class="form-control"
            required
            placeholder="••••••••"
            style="padding-right: 60px"
          />
          <button
            type="button"
            id="toggle-confirmar-senha"
            style="
              position: absolute;
              right: 15px;
              background: none;
              border: none;
              color: var(--accent);
              font-family: monospace;
              font-size: 0.85rem;
              cursor: pointer;
              z-index: 10;
              padding: 0;
            "
          >
            Ver
          </button>
        </div>
      </div>

      <div
        id="pass-match-msg"
        class="small mb-3 text-center"
        style="display: none; font-family: monospace"
      ></div>

      <button
        type="submit"
        id="btn-submit"
        class="btn btn-accent w-100 fw-bold"
        disabled
        style="opacity: 0.5; cursor: not-allowed; transition: all 0.2s ease"
      >
        ATUALIZAR SENHA
      </button>
    </form>
  </div>
</div>

<script>
  const btnSubmit = document.getElementById("btn-submit");
  const pass = document.getElementById("senha");
  const confirmPass = document.getElementById("confirmar_senha");
  const matchMsg = document.getElementById("pass-match-msg");

  // Alternar visibilidade da Senha
  document
    .getElementById("toggle-senha")
    .addEventListener("click", function () {
      if (pass.type === "password") {
        pass.type = "text";
        this.innerText = "Ocultar";
        this.style.color = "#ffffff";
      } else {
        pass.type = "password";
        this.innerText = "Ver";
        this.style.color = "var(--accent)";
      }
    });

  // Alternar visibilidade do Confirmar Senha
  document
    .getElementById("toggle-confirmar-senha")
    .addEventListener("click", function () {
      if (confirmPass.type === "password") {
        confirmPass.type = "text";
        this.innerText = "Ocultar";
        this.style.color = "#ffffff";
      } else {
        confirmPass.type = "password";
        this.innerText = "Ver";
        this.style.color = "var(--accent)";
      }
    });

  // Validação dinâmica idêntica à tela anterior
  function validarForm() {
    const senhasIguais = pass.value === confirmPass.value && pass.value !== "";

    if (pass.value !== "" && confirmPass.value !== "") {
      matchMsg.style.display = "block";
      if (senhasIguais) {
        matchMsg.innerText = "✓ As senhas coincidem";
        matchMsg.style.color = "var(--success)";
      } else {
        matchMsg.innerText = "✗ As senhas são diferentes";
        matchMsg.style.color = "#ff4d4d";
      }
    } else {
      matchMsg.style.display = "none";
    }

    // Altera o estado e o estilo do botão de submit de acordo com o resultado
    if (senhasIguais) {
      btnSubmit.disabled = false;
      btnSubmit.style.opacity = "1";
      btnSubmit.style.cursor = "pointer";
    } else {
      btnSubmit.disabled = true;
      btnSubmit.style.opacity = "0.5";
      btnSubmit.style.cursor = "not-allowed";
    }
  }

  [pass, confirmPass].forEach((el) =>
    el.addEventListener("input", validarForm),
  );

  document
    .getElementById("form-resetar")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.style.opacity = "0.5";
      btnSubmit.innerText = "ATUALIZANDO...";

      const dados = {
        token: document.getElementById("token").value,
        nova_senha: pass.value,
      };

      if (!dados.token) {
        alert("Erro: Token de recuperação ausente ou inválido.");
        validarForm();
        return;
      }

      try {
        const response = await fetch('{% url "resetar_senha" %}', {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}",
          },
          body: JSON.stringify(dados),
        });

        const result = await response.json();

        if (response.ok) {
          alert("✓ Sucesso: " + result.mensagem);
          window.location.href = '{% url "login" %}';
        } else {
          alert("Erro: " + result.erro);
          validarForm();
        }
      } catch (err) {
        alert("Erro de conexão com o servidor.");
        validarForm();
      }
    });
</script>
{% endblock %}
