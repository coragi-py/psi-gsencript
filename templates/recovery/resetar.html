{% extends 'base.html' %} {% block content %}
<div class="auth-container">
  <h2>NOVA SENHA MESTRA</h2>
  <form id="form-reset">
    <div class="form-group">
      <label>TOKEN DE SEGURANÇA</label>
      <input type="text" id="token" required placeholder="Cole o token aqui" />
    </div>
    <div class="form-group">
      <label>NOVA SENHA</label>
      <div class="password-wrapper">
        <input type="password" id="nova_senha" required />
        <button
          type="button"
          class="toggle-password"
          onclick="togglePass('nova_senha')"
        >
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-primary btn-full">
      ATUALIZAR PROTOCOLO
    </button>
  </form>
</div>

<script>
  function togglePass(id) {
    const input = document.getElementById(id);
    const icon = input.nextElementSibling.querySelector("i");
    input.type = input.type === "password" ? "text" : "password";
    icon.classList.toggle("fa-eye");
    icon.classList.toggle("fa-eye-slash");
  }

  document
    .getElementById("form-reset")
    .addEventListener("submit", async (e) => {
      e.preventDefault();
      const response = await fetch('{% url "resetar_senha" %}', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          token: document.getElementById("token").value,
          nova_senha: document.getElementById("nova_senha").value,
        }),
      });
      if (response.ok) {
        alert("Senha alterada! Redirecionando para login...");
        window.location.href = "{% url 'login' %}";
      } else {
        const data = await response.json();
        alert(data.erro);
      }
    });
</script>
{% endblock %}
