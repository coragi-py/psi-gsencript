{% extends 'base.html' %} {% block content %}
<div class="auth-container">
  <h2>RECUPERAR ACESSO</h2>
  <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px">
    Insira seu e-mail para receber um token de autorização.
  </p>
  <form id="form-solicitar">
    <div class="form-group">
      <label>E-MAIL CADASTRADO</label>
      <input type="email" id="email" required />
    </div>
    <button type="submit" class="btn-primary btn-full">SOLICITAR TOKEN</button>
  </form>

  <div
    id="resultado"
    style="
      display: none;
      margin-top: 20px;
      border: 1px dashed var(--accent);
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
    "
  >
    <p style="color: var(--accent); font-size: 0.8rem; margin-bottom: 10px">
      Token gerado (Simulando envio de e-mail):
    </p>
    <div
      style="
        background: #000;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        white-space: nowrap;
        border: 1px solid #333;
        scrollbar-width: thin; /* Para Firefox */
        scrollbar-color: var(--accent) #000; /* Para Firefox */
      "
    >
      <code
        id="token-exibido"
        style="font-family: var(--font-mono); color: #fff; font-size: 1rem"
      ></code>
    </div>
    <a
      href="{% url 'resetar_senha' %}"
      class="btn-primary btn-full"
      style="display: block; text-decoration: none; margin-top: 15px"
      >REDEFINIR SENHA</a
    >
    <button
      onclick="copyToken()"
      style="
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 0.7rem;
        cursor: pointer;
        margin-top: 5px;
        display: block;
        width: 100%;
        text-align: right;
      "
    >
      <i class="fas fa-copy"></i> COPIAR TOKEN
    </button>
  </div>

  <script>
    document
      .getElementById("form-solicitar")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const response = await fetch('{% url "solicitar_recuperacao" %}', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
          }),
        });
        const data = await response.json();
        if (response.ok) {
          document.getElementById("form-solicitar").style.display = "none";
          document.getElementById("resultado").style.display = "block";
          document.getElementById("token-exibido").innerText = data.token;
        } else {
          alert(data.erro);
        }
      });
    function copyToken() {
      const token = document.getElementById("token-exibido").innerText;
      navigator.clipboard.writeText(token);
      alert("Token copiado para a área de transferência!");
    }
  </script>
  {% endblock %}
</div>
