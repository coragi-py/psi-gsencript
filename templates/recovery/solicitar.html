{% extends 'base.html' %} {% block content %}
<div class="vault-container">
  <div class="card shadow-lg">
    <h2 class="text-accent mb-4">RECUPERAR IDENTIDADE</h2>
    <p class="mb-4 text-muted small">
      Insira seu e-mail cadastrado. Um link de redefinição de acesso seguro será
      enviado para sua caixa de entrada.
    </p>

    <form id="form-solicitar">
      <div class="form-group mb-4">
        <label for="email">E-mail Cadastrado</label>
        <input
          type="email"
          id="email"
          required
          placeholder="seuemail@exemplo.com"
        />
      </div>

      <button type="submit" id="btn-submit" class="btn btn-accent w-100">
        SOLICITAR LINK DE ACESSO
      </button>
    </form>

    <div
      id="feedback-msg"
      class="mt-4 p-3 bg-dark border-accent text-center"
      style="display: none; border: 1px solid var(--accent); border-radius: 4px"
    >
      <p
        id="msg-texto"
        style="
          color: var(--success);
          font-family: monospace;
          font-size: 0.9rem;
          margin: 0;
        "
      ></p>
    </div>
  </div>
</div>

<script>
  document
    .getElementById("form-solicitar")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const btnSubmit = document.getElementById("btn-submit");
      const emailVal = document.getElementById("email").value;
      const feedbackBox = document.getElementById("feedback-msg");
      const feedbackTexto = document.getElementById("msg-texto");

      // Desabilita o botão para evitar cliques duplicados durante o envio SMTP
      btnSubmit.disabled = true;
      btnSubmit.innerText = "ENVIANDO...";

      try {
        const response = await fetch('{% url "solicitar_recuperacao" %}', {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}",
          },
          body: JSON.stringify({ email: emailVal }),
        });

        const result = await response.json();
        feedbackBox.style.display = "block";

        if (response.ok) {
          feedbackTexto.innerText = "✓ " + result.mensagem;
          feedbackTexto.style.color = "var(--success)";
          document.getElementById("form-solicitar").reset();
        } else {
          feedbackTexto.innerText = "✗ Erro: " + result.erro;
          feedbackTexto.style.color = "#ff4d4d";
        }
      } catch (err) {
        feedbackBox.style.display = "block";
        feedbackTexto.innerText =
          "✗ Erro de conexão com o servidor de segurança.";
        feedbackTexto.style.color = "#ff4d4d";
      } finally {
        // Restaura o botão após o término da requisição
        btnSubmit.disabled = false;
        btnSubmit.innerText = "SOLICITAR LINK DE ACESSO";
      }
    });
</script>
{% endblock %}
